name: Karate API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-cmd "wget -qO- http://localhost:5050/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 40s
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for TestFlow
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5050/health; then
              echo "TestFlow OK"
              exit 0
            fi
            sleep 2
          done
          echo "TestFlow not ready" >&2
          exit 1

      - name: Run @smoke
        env:
          BASE_URL: http://localhost:5050
          KARATE_ENV: ci
        run: mvn -B test -Psmoke,ci

      - name: Upload Karate reports (smoke)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: karate-reports-smoke
          path: target/karate-reports/
          if-no-files-found: ignore

  api:
    name: API / regression
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20
    services:
      testflow:
        image: qaschool/testflow:latest
        ports:
          - 5050:5050
        options: >-
          --health-cmd "wget -qO- http://localhost:5050/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 40s
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for TestFlow
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5050/health; then
              echo "TestFlow OK"
              exit 0
            fi
            sleep 2
          done
          echo "TestFlow not ready" >&2
          exit 1

      - name: Run @api
        env:
          BASE_URL: http://localhost:5050
          KARATE_ENV: ci
        run: mvn -B test -Papi,ci

      - name: Upload Karate reports (api)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: karate-reports-api
          path: target/karate-reports/
          if-no-files-found: ignore

      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
